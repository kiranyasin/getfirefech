# GetFireFech: app + YouTube PO-token helper + automatic HTTPS for your domain.
#
#   DOMAIN=getfirefech.com docker compose up -d --build
#
# Caddy gets and renews a free SSL certificate automatically.
# Leave DOMAIN empty to serve plain http on port 80 (for testing by IP).

services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      - bgutil
    environment:
      - MAX_DURATION_SECONDS=${MAX_DURATION_SECONDS:-10800}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - POT_PROVIDER_URL=http://bgutil:4416
      - YTDLP_PROXY=${YTDLP_PROXY:-}
      # Optional fallback, only used if YouTube still blocks:
      # - COOKIES_FILE=/app/cookies.txt
    # volumes:
    #   - ./cookies.txt:/app/cookies.txt:ro
    expose:
      - "8000"

  # Generates YouTube "proof of origin" tokens so the server isn't treated as a bot.
  # Internal only: never publish its port to the internet.
  bgutil:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped
    init: true
    expose:
      - "4416"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from ${DOMAIN:-:80} --to app:8000
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
